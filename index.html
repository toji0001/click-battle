<html lang="en">

<title>VIP CYBER PREDICTOR DASHBOARD</title>
<style>
        :root {
            --bg-color: #080b10;
            --card-bg: rgba(15, 23, 42, 0.75);
            --primary-glow: #00f3ff;
            --secondary-glow: #7000ff;
            --accent-green: #00ff88;
            --accent-red: #ff0055;
            --accent-gold: #ffd700;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background Glow */
        .bg-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.15), transparent 70%);
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 440px;
            margin: 20px auto;
        }

        /* Modern Glass Card */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 24px;
            padding: 28px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            text-align: center;
            position: relative;
        }

        /* Vector Badge Icon instead of Image */
        .brand-badge {
            width: 60px;
            height: 60px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            cursor: pointer;
        }

        .title-main {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--primary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Inputs & Buttons */
        .login-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            text-align: center;
            font-size: 1rem;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .login-box input:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-main {
            background: linear-gradient(90deg, var(--primary-glow), var(--secondary-glow));
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
        }

        .telegram-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: rgba(0, 136, 204, 0.15);
            border: 1px solid rgba(0, 136, 204, 0.5);
            color: #00f3ff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .telegram-btn:hover {
            background: rgba(0, 136, 204, 0.3);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        /* Rhombus Prediction Container */
        .rhombus-dashboard {
            width: 180px;
            height: 180px;
            margin: 25px auto;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.1), rgba(112, 0, 255, 0.2));
            transform: rotate(45deg);
            border: 2px solid var(--primary-glow);
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2), inset 0 0 15px rgba(112, 0, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.5s;
        }

        .rhombus-content {
            transform: rotate(-45deg);
            text-align: center;
        }

        .pred-text {
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            letter-spacing: 1px;
        }

        /* Timer UI */
        .timer-box {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            margin: 10px 0 15px;
        }

        .timer-box span {
            color: var(--primary-glow);
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* CSS Rendered 3D Ball Styling (Replaces Image Loading) */
        .balls-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
        }

        .css-ball {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #2a384c, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--primary-glow);
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset -3px -3px 6px rgba(0, 0, 0, 0.8), 0 0 12px rgba(0, 243, 255, 0.3);
            transition: 0.3s;
        }

        .css-ball:hover {
            transform: scale(1.15);
            border-color: var(--primary-glow);
        }

        /* History Log Table */
        .history-card {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px;
            max-height: 220px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px 4px;
            font-size: 0.8rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .win {
            color: var(--accent-green);
            font-weight: 700;
        }

        .loss {
            color: var(--accent-red);
            font-weight: 700;
        }

        .hidden {
            display: none !important;
        }

        /* Admin Overlay */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 90;
        }

        #adminPanel {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            width: 85%;
            max-width: 320px;
        }
    </style>
