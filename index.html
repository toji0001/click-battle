<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #25252b;
            color: white;
            padding: 15px;
        }

        .container {
            position: relative;
            width: 750px;
            height: 450px;
            border: 2px solid #e46033;
            box-shadow: 0 0 25px #e46033;
            overflow: hidden;
            background: #25252b;
        }

        /* Decorative shapes */
        .curved-shape,
        .curved-shape2 {
            position: absolute;
            pointer-events: none;
        }

        .curved-shape {
            right: 0;
            top: -5px;
            width: 850px;
            height: 600px;
            background: linear-gradient(45deg, #25252b, #e46033);
            transform: rotate(10deg) skewY(40deg);
            transform-origin: bottom right;
            transition: 1.5s ease;
            transition-delay: 1.6s;
            z-index: 1;
        }

        .container.active .curved-shape {
            transform: rotate(0deg) skewY(0deg);
            transition-delay: .5s;
        }

        .curved-shape2 {
            left: 250px;
            top: 100%;
            width: 850px;
            height: 700px;
            background: #25252b;
            border-top: 3px solid #e46033;
            transform: rotate(0deg) skewY(0deg);
            transform-origin: bottom left;
            transition: 1.5s ease;
            transition-delay: .5s;
            z-index: 1;
        }

        .container.active .curved-shape2 {
            transform: rotate(-11deg) skewY(-41deg);
            transition-delay: 1.2s;
        }

        /* Forms */
        .form-box {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            flex-direction: column;
            z-index: 5;
        }

        .form-box.Login {
            left: 0;
            padding: 0 40px;
        }

        .form-box.Register {
            right: 0;
            padding: 0 60px;
        }

        .form-box h2 {
            color: white;
            font-size: 32px;
            text-align: center;
        }

        /* Login animation */
        .form-box.Login .animation {
            transform: translateX(0);
            opacity: 1;
            transition: .7s;
            transition-delay: calc(.1s * var(--S));
        }

        .container.active .form-box.Login .animation {
            transform: translateX(-120%);
            opacity: 0;
            transition-delay: calc(.1s * var(--D));
        }

        /* Register animation */
        .form-box.Register .animation {
            transform: translateX(120%);
            opacity: 0;
            filter: blur(10px);
            transition: .7s ease;
            transition-delay: calc(.1s * var(--S));
        }

        .container.active .form-box.Register .animation {
            transform: translateX(0);
            opacity: 1;
            filter: blur(0);
            transition-delay: calc(.1s * var(--li));
        }

        /* Inputs */
        .input-box {
            position: relative;
            width: 100%;
            height: 50px;
            margin-top: 25px;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            padding-right: 30px;
            background: transparent;
            border: none;
            border-bottom: 2px solid white;
            outline: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .input-box input:focus,
        .input-box input:valid {
            border-bottom-color: #e46033;
        }

        .input-box label {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 16px;
            pointer-events: none;
            transition: .5s;
        }

        .input-box input:focus ~ label,
        .input-box input:valid ~ label {
            top: -5px;
            color: #e46033;
        }

        .input-box box-icon {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* Buttons */
        .btn {
            position: relative;
            width: 100%;
            height: 45px;
            border: 2px solid #e46033;
            border-radius: 40px;
            background: transparent;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            z-index: 10;
        }

        .btn::before {
            content: "";
            position: absolute;
            left: 0;
            top: -100%;
            width: 100%;
            height: 300%;
            background: linear-gradient(
                #25252b,
                #e46033,
                #25252b,
                #e46033
            );
            transition: .5s;
            z-index: -1;
        }

        .btn:hover::before {
            top: 0;
        }

        /* Links */
        .regi-link {
            margin: 20px 0 10px;
            text-align: center;
            font-size: 14px;
            color: white;
        }

        .regi-link a {
            color: #e46033;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            z-index: 20;
        }

        .regi-link a:hover {
            text-decoration: underline;
        }

        /* Info */
        .info-content {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            flex-direction: column;
            z-index: 2;
            pointer-events: none;
        }

        .info-content.Login {
            right: 0;
            text-align: right;
            padding: 0 40px 60px 150px;
        }

        .info-content.Register {
            left: 0;
            text-align: left;
            padding: 0 150px 60px 38px;
        }

        .info-content h2 {
            color: white;
            text-transform: uppercase;
            font-size: 36px;
            line-height: 1.3;
        }

        .info-content p {
            color: white;
            font-size: 16px;
        }

        .info-content.Login .animation {
            transform: translateX(0);
            opacity: 1;
            filter: blur(0);
            transition: .7s ease;
            transition-delay: calc(.1s * var(--S));
        }

        .container.active .info-content.Login .animation {
            transform: translateX(120%);
            opacity: 0;
            filter: blur(10px);
            transition-delay: calc(.1s * var(--D));
        }

        .info-content.Register .animation {
            transform: translateX(-120%);
            opacity: 0;
            filter: blur(10px);
            transition: .7s ease;
            transition-delay: calc(.1s * var(--S));
        }

        .container.active .info-content.Register .animation {
            transform: translateX(0);
            opacity: 1;
            filter: blur(0);
            transition-delay: calc(.1s * var(--li));
        }

        /* Mobile */
        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .container {
                width: 100%;
                max-width: 420px;
                height: 520px;
            }

            .form-box {
                width: 100%;
                padding: 0 30px !important;
            }

            .info-content {
                display: none;
            }

            .curved-shape,
            .curved-shape2 {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="curved-shape"></div>
    <div class="curved-shape2"></div>

    <!-- LOGIN -->
    <div class="form-box Login">

        <h2 class="animation" style="--D:0; --S:21;">
            Login
        </h2>

        <form id="loginForm">

            <div class="input-box animation" style="--D:1; --S:22;">
                <input type="text" required>
                <label>Username</label>
                <box-icon type="solid" name="user" color="gray"></box-icon>
            </div>

            <div class="input-box animation" style="--D:2; --S:23;">
                <input type="password" required>
                <label>Password</label>
                <box-icon name="lock-alt" type="solid" color="gray"></box-icon>
            </div>

            <div class="input-box animation" style="--D:3; --S:24;">
                <button class="btn" type="submit">
                    Login
                </button>
            </div>

            <div class="regi-link animation" style="--D:4; --S:25;">
                <p>
                    Don't have an account?
                    <br>
                    <a href="#" class="SignUpLink">Sign Up</a>
                </p>
            </div>

        </form>
    </div>

    <!-- LOGIN INFO -->
    <div class="info-content Login">

        <h2 class="animation" style="--D:0; --S:20;">
            Welcome Back!
        </h2>

        <p class="animation" style="--D:1; --S:21;">
            We are happy to have you with us again.
        </p>

    </div>

    <!-- REGISTER -->
    <div class="form-box Register">

        <h2 class="animation" style="--li:17; --S:0;">
            Register
        </h2>

        <form id="registerForm">

            <div class="input-box animation" style="--li:18; --S:1;">
                <input type="text" required>
                <label>Username</label>
                <box-icon type="solid" name="user" color="gray"></box-icon>
            </div>

            <div class="input-box animation" style="--li:19; --S:2;">
                <input type="email" required>
                <label>Email</label>
                <box-icon name="envelope" type="solid" color="gray"></box-icon>
            </div>

            <div class="input-box animation" style="--li:19; --S:3;">
                <input type="password" required>
                <label>Password</label>
                <box-icon name="lock-alt" type="solid" color="gray"></box-icon>
            </div>

            <div class="input-box animation" style="--li:20; --S:4;">
                <button class="btn" type="submit">
                    Register
                </button>
            </div>

            <div class="regi-link animation" style="--li:21; --S:5;">
                <p>
                    Already have an account?
                    <br>
                    <a href="#" class="SignInLink">Sign In</a>
                </p>
            </div>

        </form>
    </div>

    <!-- REGISTER INFO -->
    <div class="info-content Register">

        <h2 class="animation" style="--li:17; --S:0;">
            Welcome!
        </h2>

        <p class="animation" style="--li:18; --S:1;">
            We're delighted to have you here.
        </p>

    </div>

</div>

<script>
    const container = document.querySelector(".container");
    const signUpLink = document.querySelector(".SignUpLink");
    const signInLink = document.querySelector(".SignInLink");

    signUpLink.addEventListener("click", function(event) {
        event.preventDefault();
        container.classList.add("active");
    });

    signInLink.addEventListener("click", function(event) {
        event.preventDefault();
        container.classList.remove("active");
    });

    document.querySelector("#loginForm").addEventListener("submit", function(event) {
        event.preventDefault();
        alert("Login button clicked!");
    });

    document.querySelector("#registerForm").addEventListener("submit", function(event) {
        event.preventDefault();
        alert("Register button clicked!");
    });
</script>

</body>
</html>
