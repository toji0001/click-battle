<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login & Register</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #25252b;
}

.container {
    width: 350px;
    min-height: 430px;
    padding: 35px;
    border: 2px solid #e46033;
    box-shadow: 0 0 25px #e46033;
    border-radius: 10px;
    background: #25252b;
}

.form {
    display: none;
}

.form.active {
    display: block;
}

h2 {
    text-align: center;
    color: white;
    margin-bottom: 30px;
}

.input {
    width: 100%;
    margin-bottom: 20px;
}

.input input {
    width: 100%;
    height: 48px;
    padding: 0 15px;
    border: 2px solid #777;
    border-radius: 6px;
    outline: none;
    background: transparent;
    color: white;
    font-size: 16px;
}

.input input:focus {
    border-color: #e46033;
}

button {
    width: 100%;
    height: 48px;
    border: 2px solid #e46033;
    border-radius: 25px;
    background: #e46033;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.switch {
    text-align: center;
    color: white;
    margin-top: 20px;
    font-size: 14px;
}

.switch a {
    color: #e46033;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
}

.switch a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div id="login" class="form active">

        <h2>Login</h2>

        <div class="input">
            <input type="text" placeholder="Username">
        </div>

        <div class="input">
            <input type="password" placeholder="Password">
        </div>

        <button type="button" onclick="login()">
            Login
        </button>

        <div class="switch">
            Don't have an account?
            <br>
            <a href="#" onclick="showRegister(event)">
                Sign Up
            </a>
        </div>

    </div>


    <!-- REGISTER -->
    <div id="register" class="form">

        <h2>Register</h2>

        <div class="input">
            <input type="text" placeholder="Username">
        </div>

        <div class="input">
            <input type="email" placeholder="Email">
        </div>

        <div class="input">
            <input type="password" placeholder="Password">
        </div>

        <button type="button" onclick="register()">
            Register
        </button>

        <div class="switch">
            Already have an account?
            <br>
            <a href="#" onclick="showLogin(event)">
                Sign In
            </a>
        </div>

    </div>

</div>

<script>

function showRegister(event) {
    event.preventDefault();

    document.getElementById("login").classList.remove("active");
    document.getElementById("register").classList.add("active");
}

function showLogin(event) {
    event.preventDefault();

    document.getElementById("register").classList.remove("active");
    document.getElementById("login").classList.add("active");
}

function login() {
    alert("Login button clicked!");
}

function register() {
    alert("Register button clicked!");
}

</script>

</body>
    </html>
