<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Click Battle 1v1</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    text-align: center;
    font-family: Arial;
}

#menu {
    margin-top: 100px;
}

#game {
    display: none;
}

#over {
    display: none;
    margin-top: 100px;
}

input {
    padding: 14px;
    font-size: 18px;
    border-radius: 8px;
    border: 0;
    margin: 5px;
    width: 180px;
}

button {
    padding: 14px 22px;
    font-size: 18px;
    border: 0;
    border-radius: 10px;
    margin: 6px;
}

#target {
    display: none;
    position: fixed;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: red;
    color: white;
    padding: 0;
}

.room {
    font-size: 22px;
    margin: 15px;
}
</style>
</head>

<body>

<div id="menu">

    <h1>🎮 CLICK BATTLE 1v1</h1>

    <button onclick="createRoom()">CREATE ROOM</button>

    <br>

    <input id="roomInput" placeholder="Room Code">

    <button onclick="joinRoom()">JOIN ROOM</button>

    <p id="status"></p>

</div>


<div id="game">

    <h2>Room: <span id="roomName"></span></h2>

    <h2>
        You: <span id="myScore">0</span>
        |
        Opponent: <span id="opScore">0</span>
    </h2>

    <h2>Time: <span id="time">30</span></h2>

    <button id="target" onclick="hit()">CLICK!</button>

</div>


<div id="over">

    <h1 id="result"></h1>

    <h2>
        Your Score: <span id="finalMy">0</span>
    </h2>

    <h2>
        Opponent: <span id="finalOp">0</span>
    </h2>

    <button onclick="location.reload()">🔄 PLAY AGAIN</button>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    get,
    update,
    onValue,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

import {
    getAuth,
    signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


/* =========================
   FIREBASE CONFIG
   ========================= */

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};


/* ========================= */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);

let user;

let roomCode = "";

let playerNumber = "";

let score = 0;

let time = 30;

let timer;

let gameStarted = false;


/* LOGIN */

signInAnonymously(auth)
.then((result) => {

    user = result.user;

})
.catch((error) => {

    console.log(error);

    document.getElementById("status").innerText =
        "Firebase login error";

});


/* ROOM CODE */

function makeRoomCode() {

    return Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();

}


/* CREATE ROOM */

window.createRoom = async function() {

    if (!user) {

        document.getElementById("status").innerText =
            "Connecting... try again";

        return;
    }

    roomCode = makeRoomCode();

    const roomRef = ref(db, "rooms/" + roomCode);

    await set(roomRef, {

        player1: {
            uid: user.uid,
            score: 0
        },

        player2: null,

        status: "waiting",

        startTime: null

    });

    playerNumber = "player1";

    document.getElementById("status").innerText =
        "Room created! Code: " + roomCode;

    document.getElementById("roomInput").value =
        roomCode;

    listenRoom();

};


/* JOIN ROOM */

window.joinRoom = async function() {

    if (!user) {

        document.getElementById("status").innerText =
            "Connecting... try again";

        return;
    }

    roomCode =
        document.getElementById("roomInput")
        .value.trim()
        .toUpperCase();

    if (!roomCode) {

        document.getElementById("status").innerText =
            "Enter room code";

        return;
    }

    const roomRef =
        ref(db, "rooms/" + roomCode);

    const snapshot =
        await get(roomRef);

    if (!snapshot.exists()) {

        document.getElementById("status").innerText =
            "Room not found";

        return;
    }

    const room = snapshot.val();

    if (room.player2) {

        document.getElementById("status").innerText =
            "Room is full";

        return;
    }

    await update(roomRef, {

        player2: {
            uid: user.uid,
            score: 0
        },

        status: "ready"

    });

    playerNumber = "player2";

    document.getElementById("status").innerText =
        "Joined room!";

    listenRoom();

};


/* LISTEN TO ROOM */

function listenRoom() {

    const roomRef =
        ref(db, "rooms/" + roomCode);

    onValue(roomRef, (snapshot) => {

        if (!snapshot.exists()) return;

        const room = snapshot.val();

        if (
            room.player1 &&
            room.player2 &&
            !gameStarted
        ) {

            startMultiplayerGame();

        }

        if (room.player1) {

            if (playerNumber === "player1") {

                document.getElementById("myScore")
                    .innerText =
                    room.player1.score || 0;

                document.getElementById("opScore")
                    .innerText =
                    room.player2
                    ? room.player2.score || 0
                    : 0;

            } else {

                document.getElementById("myScore")
                    .innerText =
                    room.player2
                    ? room.player2.score || 0
                    : 0;

                document.getElementById("opScore")
                    .innerText =
                    room.player1.score || 0;

            }

        }

    });

}


/* START GAME */

async function startMultiplayerGame() {

    gameStarted = true;

    document.getElementById("menu")
        .style.display = "none";

    document.getElementById("game")
        .style.display = "block";

    document.getElementById("target")
        .style.display = "block";

    document.getElementById("roomName")
        .innerText = roomCode;

    score = 0;

    time = 30;

    move();

    timer = setInterval(() => {

        time--;

        document.getElementById("time")
            .innerText = time;

        if (time <= 0) {

            clearInterval(timer);

            finishGame();

        }

    }, 1000);

}


/* CLICK */

window.hit = async function() {

    if (!gameStarted) return;

    score++;

    const scoreRef =
        ref(
            db,
            "rooms/" +
            roomCode +
            "/" +
            playerNumber +
            "/score"
        );

    await set(scoreRef, score);

    move();

};


/* MOVE BUTTON */

function move() {

    const x =
        Math.random() *
        (window.innerWidth - 100);

    const y =
        100 +
        Math.random() *
        (window.innerHeight - 200);

    const target =
        document.getElementById("target");

    target.style.left =
        x + "px";

    target.style.top =
        y + "px";

}


/* FINISH */

async function finishGame() {

    gameStarted = false;

    document.getElementById("target")
        .style.display = "none";

    const roomRef =
        ref(db, "rooms/" + roomCode);

    const snapshot =
        await get(roomRef);

    if (!snapshot.exists()) return;

    const room = snapshot.val();

    let myScore =
        playerNumber === "player1"
        ? room.player1.score
        : room.player2.score;

    let opponentScore =
        playerNumber === "player1"
        ? room.player2.score
        : room.player1.score;

    document.getElementById("game")
        .style.display = "none";

    document.getElementById("over")
        .style.display = "block";

    document.getElementById("finalMy")
        .innerText = myScore;

    document.getElementById("finalOp")
        .innerText = opponentScore;

    if (myScore > opponentScore) {

        document.getElementById("result")
            .innerText = "🏆 YOU WIN!";

    } else if (myScore < opponentScore) {

        document.getElementById("result")
            .innerText = "😢 YOU LOSE!";

    } else {

        document.getElementById("result")
            .innerText = "🤝 DRAW!";

    }

}

</script>

</body>
</html>
