<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Click Battle</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#09091a,#17173b);
  color:white;
  text-align:center;
}
.screen{display:none;min-height:100vh;padding:45px 20px}
.active{display:block}
h1{font-size:42px;margin:20px 0}
.card{
  max-width:430px;
  margin:30px auto;
  padding:30px;
  background:#ffffff12;
  border:1px solid #ffffff22;
  border-radius:24px;
  backdrop-filter:blur(10px);
}
button{
  width:100%;
  padding:16px;
  margin:10px 0;
  border:0;
  border-radius:14px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}
.primary{background:#6c5ce7;color:white}
.secondary{background:#25254d;color:white}
input{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #ffffff33;
  background:#11112b;
  color:white;
  font-size:18px;
  text-align:center;
}
.players{
  display:flex;
  justify-content:space-around;
  gap:15px;
}
.player{
  flex:1;
  padding:20px;
  border-radius:18px;
  background:#ffffff10;
}
.score{font-size:50px;font-weight:bold}
#target{
  width:120px;
  height:120px;
  border-radius:50%;
  background:#ff4757;
  color:white;
  border:0;
  font-size:20px;
  box-shadow:0 0 30px #ff475788;
}
#roomCode{
  font-size:28px;
  letter-spacing:5px;
  margin:20px;
}
.small{opacity:.7}
</style>
</head>

<body>

<div id="home" class="screen active">
  <h1>⚡ CLICK BATTLE</h1>

  <div class="card">
    <p class="small">2 Player Local Battle</p>

    <button class="primary" onclick="createRoom()">CREATE ROOM</button>

    <input id="joinCode" placeholder="Enter Room Code">

    <button class="secondary" onclick="joinRoom()">JOIN ROOM</button>
  </div>
</div>

<div id="room" class="screen">
  <h1>🎮 ROOM</h1>
  <div class="card">
    <p>Your Room Code</p>
    <div id="roomCode">------</div>
    <p class="small">Give this code to Player 2</p>
    <button class="primary" onclick="startGame()">START BATTLE</button>
    <button class="secondary" onclick="goHome()">BACK</button>
  </div>
</div>

<div id="game" class="screen">
  <h1>⚔️ BATTLE</h1>

  <div class="players">
    <div class="player">
      <h2>PLAYER 1</h2>
      <div id="score1" class="score">0</div>
    </div>

    <div class="player">
      <h2>PLAYER 2</h2>
      <div id="score2" class="score">0</div>
    </div>
  </div>

  <h2>TIME: <span id="time">30</span></h2>

  <button id="target" onclick="clickTarget()">CLICK!</button>
</div>

<div id="result" class="screen">
  <h1>🏆 RESULT</h1>

  <div class="card">
    <h2 id="winner"></h2>
    <h2>Player 1: <span id="final1">0</span></h2>
    <h2>Player 2: <span id="final2">0</span></h2>

    <button class="primary" onclick="location.reload()">PLAY AGAIN</button>
  </div>
</div>

<script>
let player=0;
let score1=0;
let score2=0;
let time=30;
let timer=null;

function show(id){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function createRoom(){
  player=1;

  let code=Math.floor(100000+Math.random()*900000);

  document.getElementById("roomCode").innerText=code;

  playSound(500);

  show("room");
}

function joinRoom(){
  let code=document.getElementById("joinCode").value.trim();

  if(code.length<6){
    alert("6 digit Room Code daalo!");
    return;
  }

  player=2;

  playSound(600);

  startGame();
}

function startGame(){
  score1=0;
  score2=0;
  time=30;

  document.getElementById("score1").innerText=0;
  document.getElementById("score2").innerText=0;
  document.getElementById("time").innerText=30;

  show("game");

  clearInterval(timer);

  timer=setInterval(()=>{
    time--;
    document.getElementById("time").innerText=time;

    if(time<=0){
      clearInterval(timer);
      finishGame();
    }
  },1000);
}

function clickTarget(){
  if(player===1){
    score1++;
    document.getElementById("score1").innerText=score1;
  }else{
    score2++;
    document.getElementById("score2").innerText=score2;
  }

  playSound(700);
}

function finishGame(){
  document.getElementById("final1").innerText=score1;
  document.getElementById("final2").innerText=score2;

  if(score1>score2){
    document.getElementById("winner").innerText="🥇 PLAYER 1 WINS!";
  }else if(score2>score1){
    document.getElementById("winner").innerText="🥇 PLAYER 2 WINS!";
  }else{
    document.getElementById("winner").innerText="🤝 DRAW!";
  }

  playSound(900);
  show("result");
}

function goHome(){
  show("home");
}

function playSound(freq){
  try{
    let audio=new AudioContext();
    let osc=audio.createOscillator();
    let gain=audio.createGain();

    osc.frequency.value=freq;
    osc.type="sine";

    gain.gain.setValueAtTime(.08,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+.15
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime+.15);
  }catch(e){}
}
</script>

</body>
</html>
