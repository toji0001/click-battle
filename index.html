<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️‍🔥𝗩𝗜𝗣 DHANRAJ 𝗠𝗢𝗗𝗦❤️‍🔥</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #ff003c;
            --gold: #ffb700;
            --bg: #07080a;
            --card-bg: #0f1117;
            --neon-blue: #00f2ff;
            --green: #00ff66;
        }
        body {
            background: var(--bg);
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
            min-height: 100vh;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-card {
            background: rgba(15, 17, 23, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }
        .circle-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
        }
        svg { transform: rotate(-90deg); }
        circle {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s ease, stroke 0.5s ease;
        }
        .bg-circle { stroke: rgba(255, 255, 255, 0.05); }
        
        /* Mode Buttons */
        .mode-btn {
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #71717a;
            padding: 8px 4px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .mode-btn.active {
            background: rgba(185, 28, 28, 0.25);
            border-color: #ef4444;
            color: #f87171;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
        }

        /* Badges */
        .badge-win { 
            background: rgba(0, 255, 102, 0.15); 
            color: #00ff66; 
            border: 1px solid #00ff66; 
        }
        .badge-jackpot { 
            background: rgba(255, 150, 0, 0.25); 
            color: #ff9d00; 
            border: 1px solid #ff9d00;
            box-shadow: 0 0 10px rgba(255, 157, 0, 0.4);
        }
        .badge-loss { 
            background: rgba(255, 0, 60, 0.15); 
            color: #ff003c; 
            border: 1px solid #ff003c; 
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">

    <!-- Auth Layer -->
    <div id="auth-box" class="fixed inset-0 z-[5000] bg-black/95 flex items-center justify-center p-4">
        <div class="glass-card p-8 rounded-3xl w-full max-w-sm text-center border-red-900/50">
            <h1 class="text-3xl font-black orbitron text-red-500 mb-2">𝗟𝗨𝗖𝗖𝗜𝗙𝗘𝗥 𝗠𝗢𝗗𝗦</h1>
            <p class="text-xs text-zinc-500 mb-6 uppercase tracking-widest">Multi-Logic Engine V4.0</p>
            <input type="password" id="key" placeholder="ACCESS KEY" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-center mb-4 outline-none focus:border-red-500 text-white font-bold">
            <button onclick="login()" class="w-full bg-red-600 hover:bg-red-700 py-3 rounded-xl font-bold uppercase tracking-wider transition">Connect System</button>
            <div class="mt-5 space-y-2">
                <a href="https://t.me/VIPGROUPDHANRAJ" target="_blank" rel="noopener noreferrer"
                   class="block w-full bg-sky-600 hover:bg-sky-700 py-3 rounded-xl font-bold uppercase tracking-wider transition">
                    Telegram: VIPGROUPDHANRAJ
                </a>
                <a href="https://t.me/DHANRAJ_BHAI" target="_blank" rel="noopener noreferrer"
                   class="block w-full border border-sky-500 text-sky-400 hover:bg-sky-500/10 py-3 rounded-xl font-bold uppercase tracking-wider transition">
                    CONTACT TO OWNER
                </a>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="app" class="hidden w-full max-w-md space-y-4">
        
        <!-- Header -->
        <div class="flex justify-between items-center glass-card p-4 rounded-2xl">
            <div>
                <span class="text-[10px] text-zinc-500 uppercase block font-bold">𝐒𝐄𝐑𝐕𝐄𝐑 𝐒𝐓𝐀𝐓𝐔𝐒</span>
                <span class="text-xs text-green-400 font-bold flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-ping"></span> ONLINE
                </span>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-zinc-500 uppercase block font-bold">Live Clock</span>
                <span id="timer" class="text-xs font-mono text-zinc-300">00:00:00</span>
            </div>
        </div>

        <!-- Prediction Panel -->
        <div class="glass-card p-6 rounded-3xl text-center relative overflow-hidden">
            <div id="period" class="text-xs font-bold text-zinc-400 tracking-widest mb-3">PERIOD: LOADING...</div>
            
            <!-- Circle Container (Contains ONLY WinGo 1Min Countdown) -->
            <div class="circle-container mb-4">
                <svg width="180" height="180">
                    <circle class="bg-circle" cx="90" cy="90" r="75"></circle>
                    <circle id="progress-circle" cx="90" cy="90" r="75" stroke-dasharray="471" stroke-dashoffset="471"></circle>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span id="sec-timer" class="text-4xl font-black orbitron text-white leading-none">60s</span>
                    <span class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest mt-1">𝗪𝗜𝗡𝗚𝗢 1𝗠</span>
                </div>
            </div>

            <!-- Prediction Displayed Below the Circle -->
            <div class="bg-zinc-950/60 p-4 rounded-2xl border border-zinc-800/80 mb-4">
                <span class="text-[10px] text-zinc-400 uppercase font-bold tracking-widest block mb-1">NEXT PREDICTION</span>
                <h2 id="prediction" class="text-5xl font-black orbitron tracking-tight my-1">--</h2>
                
                <div class="flex items-center justify-center gap-2 mt-2">
                    <span class="text-xs text-zinc-400 font-bold">𝗡𝗨𝗠𝗕𝗘𝗥𝗦:</span>
                    <span id="n1" class="bg-zinc-800 text-white text-xs px-2.5 py-0.5 rounded-md font-extrabold border border-zinc-700">?</span>
                    <span id="n2" class="bg-zinc-800 text-zinc-400 text-xs px-2.5 py-0.5 rounded-md font-extrabold border border-zinc-700">?</span>
                </div>
            </div>

            <!-- Interactive Mode Selector (BLADE, HONOR, STRIKE, ZEN) -->
            <div class="grid grid-cols-4 gap-2 mb-4">
                <button id="btn-blade" onclick="setMode('BLADE')" class="mode-btn">𝗕𝗟𝗔𝗗𝗘</button>
                <button id="btn-honor" onclick="setMode('HONOR')" class="mode-btn active">𝗛𝗢𝗡𝗢𝗥</button>
                <button id="btn-strike" onclick="setMode('STRIKE')" class="mode-btn">𝗦𝗧𝗥𝗜𝗞𝗘</button>
                <button id="btn-zen" onclick="setMode('ZEN')" class="mode-btn">𝗭𝗘𝗡</button>
            </div>

            <!-- Stats Bar -->
            <div class="flex justify-between items-center bg-zinc-900/60 px-4 py-2 rounded-xl border border-zinc-800">
                <span class="text-xs text-zinc-400 font-bold">CONFIDENCE (<span id="mode-name" class="text-red-400">HONOR</span>)</span>
                <span id="acc" class="text-sm font-black text-red-500 orbitron">--%</span>
            </div>
        </div>

        <!-- History Table -->
        <div class="glass-card p-4 rounded-3xl space-y-3">
            <div class="flex justify-between items-center px-2">
                <span class="text-xs font-bold text-zinc-400 uppercase tracking-wider">🎯Rᴇᴄᴇɴᴛ Hɪsᴛᴏʀʏ</span>
                <button onclick="clearHistory()" class="text-[10px] text-zinc-500 hover:text-zinc-300 uppercase font-bold">✕ Clear</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-center text-xs">
                    <thead>
                        <tr class="text-zinc-500 border-b border-zinc-800/60 text-[10px] uppercase">
                            <th class="pb-2">PRD</th>
                            <th class="pb-2">MODE</th>
                            <th class="pb-2">PRED</th>
                            <th class="pb-2">NUM</th>
                            <th class="pb-2">RES</th>
                        </tr>
                    </thead>
                    <tbody id="history-body" class="divide-y divide-zinc-800/30">
                        <tr><td colspan="5" class="py-4 text-zinc-600">Waiting for live data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const MASTER_KEY = "DHANRAJ";
        const API_URL = "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

        let lastId = null;
        let currentMode = "HONOR";
        let predictionStore = {}; 
        let historyList = [];
        let rawApiList = [];

        function login() {
            if(document.getElementById('key').value.trim() === MASTER_KEY) {
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                startEngine();
            } else { 
                alert("𝙈𝘼𝘿𝙀𝙍𝘾𝙃𝙊𝘿 𝙆𝙀𝙔 𝘽𝙐𝙔 𝙆𝘼𝙍😡"); 
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode.toLowerCase()}`).classList.add('active');
            document.getElementById('mode-name').innerText = mode;

            // Recalculate prediction for current active period if data available
            if (rawApiList.length > 0 && lastId) {
                const nextId = (BigInt(lastId) + 1n).toString();
                const analysis = runAI(rawApiList, currentMode);
                predictionStore[nextId] = analysis;
                updateDisplay(nextId, analysis);
            }
        }

        function clearHistory() {
            historyList = [];
            renderHistory();
        }

        function renderHistory() {
            const body = document.getElementById('history-body');
            if (historyList.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="py-4 text-zinc-600">No data available</td></tr>`;
                return;
            }

            body.innerHTML = historyList.map(item => {
                let badgeClass = "badge-loss";
                let badgeText = item.res;

                if (item.res === "JACKPOT") {
                    badgeClass = "badge-jackpot";
                    badgeText = "👹 𝗝𝗔𝗖𝗞𝗣𝗢𝗧";
                } else if (item.res === "WIN") {
                    badgeClass = "badge-win";
                    badgeText = "🦁 𝗪𝗜𝗡";
                }

                return `
                    <tr class="font-bold">
                        <td class="py-2.5 text-zinc-400">${item.prd.slice(-4)}</td>
                        <td class="py-2.5 text-zinc-500 text-[10px]">${item.mode || 'HONOR'}</td>
                        <td class="py-2.5 ${item.pred === 'BIG' ? 'text-yellow-400' : 'text-cyan-400'}">${item.pred}</td>
                        <td class="py-2.5 text-zinc-200">${item.num}</td>
                        <td class="py-2.5"><span class="px-2 py-0.5 rounded-md text-[10px] font-black ${badgeClass}">${badgeText}</span></td>
                    </tr>
                `;
            }).join('');
        }

        async function startEngine() {
            // Live clock and WinGo 1 Min Realtime Timer Countdown inside SVG Circle
            setInterval(() => { 
                const now = new Date();
                document.getElementById('timer').innerText = now.toLocaleTimeString(); 
                
                const sec = 60 - now.getSeconds();
                const secElem = document.getElementById('sec-timer');
                secElem.innerText = sec + "s";
                
                // SVG Circle countdown animation
                const circle = document.getElementById('progress-circle');
                const perimeter = 471; // 2 * pi * 75
                circle.style.strokeDashoffset = perimeter - (perimeter * (60 - sec) / 60);

                if(sec <= 5) {
                    secElem.classList.add("text-red-500", "animate-pulse");
                    secElem.classList.remove("text-white");
                    circle.setAttribute("stroke", "#ff003c");
                } else {
                    secElem.classList.add("text-white");
                    secElem.classList.remove("text-red-500", "animate-pulse");
                    circle.setAttribute("stroke", "#00f2ff");
                }
            }, 1000);

            setInterval(async () => {
                try {
                    const res = await fetch(API_URL + "?t=" + Date.now());
                    const data = await res.json();
                    const list = data.data.list;
                    rawApiList = list;
                    const latest = list[0];

                    // Process results when new period comes
                    if (lastId && lastId !== latest.issueNumber) {
                        const actualNum = parseInt(latest.number);
                        const actualSize = actualNum >= 5 ? 'BIG' : 'SMALL';
                        const predData = predictionStore[latest.issueNumber];

                        if (predData) {
                            let resultStatus = "😡𝗟𝗢𝗦𝗦";
                            
                            // JACKPOT Logic: n1 ya n2 match hone par JACKPOT
                            if (predData.n1 === actualNum || predData.n2 === actualNum) {
                                resultStatus = "JACKPOT";
                            } 
                            // WIN Logic: Size match hone par WIN
                            else if (predData.size === actualSize) {
                                resultStatus = "WIN";
                            }

                            // History List Update
                            historyList.unshift({
                                prd: latest.issueNumber,
                                mode: predData.mode,
                                pred: predData.size,
                                num: actualNum,
                                res: resultStatus
                            });

                            if (historyList.length > 10) historyList.pop();
                            renderHistory();
                        }
                    }

                    // Generate New Prediction Signal
                    if (lastId !== latest.issueNumber) {
                        const nextId = (BigInt(latest.issueNumber) + 1n).toString();
                        const analysis = runAI(list, currentMode);

                        predictionStore[nextId] = analysis;
                        updateDisplay(nextId, analysis);

                        lastId = latest.issueNumber;
                    }
                } catch (e) { 
                    console.log("Syncing Engine...", e); 
                }
            }, 3000);
        }

        function updateDisplay(nextId, analysis) {
            document.getElementById('period').innerText = "PERIOD: " + nextId;
            document.getElementById('prediction').innerText = analysis.size;
            document.getElementById('prediction').className = `text-5xl font-black orbitron tracking-tight my-1 ${analysis.size === 'BIG' ? 'text-yellow-400' : 'text-cyan-400'}`;
            document.getElementById('n1').innerText = analysis.n1;
            document.getElementById('n2').innerText = analysis.n2;
            document.getElementById('acc').innerText = analysis.conf + "%";
        }

        function runAI(list, mode) {
            const lastNum = parseInt(list[0].number);
            const secondLastNum = list[1] ? parseInt(list[1].number) : lastNum;
            const thirdLastNum = list[2] ? parseInt(list[2].number) : lastNum;

            let predictedSize = "BIG";
            let conf = 85;

            const bigNumbers = [5, 6, 7, 8, 9];
            const smallNumbers = [0, 1, 2, 3, 4];

            if (mode === "BLADE") {
                // BLADE MODE: Trend Following Logic (Continuity)
                predictedSize = lastNum >= 5 ? "BIG" : "SMALL";
                conf = Math.floor(Math.random() * (96 - 88) + 88);
            } 
            else if (mode === "HONOR") {
                // HONOR MODE: Reversal Logic
                predictedSize = lastNum >= 5 ? "SMALL" : "BIG";
                conf = Math.floor(Math.random() * (94 - 82) + 82);
            } 
            else if (mode === "STRIKE") {
                // STRIKE MODE: Pattern / Alternate Logic (Compare last 2 rounds)
                if (lastNum >= 5 && secondLastNum >= 5) {
                    predictedSize = "SMALL"; // Break dragon streak
                } else if (lastNum < 5 && secondLastNum < 5) {
                    predictedSize = "BIG";
                } else {
                    predictedSize = lastNum >= 5 ? "SMALL" : "BIG";
                }
                conf = Math.floor(Math.random() * (98 - 85) + 85);
            } 
            else if (mode === "ZEN") {
                // ZEN MODE: Weighted Average Logic (Last 3 rounds calculation)
                const avg = (lastNum + secondLastNum + thirdLastNum) / 3;
                predictedSize = avg >= 4.5 ? "SMALL" : "BIG";
                conf = Math.floor(Math.random() * (91 - 75) + 75);
            }

            let n1, n2;
            if (predictedSize === "BIG") {
                // Primary number BIG se
                n1 = bigNumbers[Math.floor(Math.random() * bigNumbers.length)];
                // Opposite number SMALL category se
                n2 = smallNumbers[Math.floor(Math.random() * smallNumbers.length)];
            } else {
                // Primary number SMALL se
                n1 = smallNumbers[Math.floor(Math.random() * smallNumbers.length)];
                // Opposite number BIG category se
                n2 = bigNumbers[Math.floor(Math.random() * bigNumbers.length)];
            }

            return { 
                mode: mode,
                size: predictedSize, 
                n1: n1, 
                n2: n2, 
                conf: conf
            };
        }
    </script>
</body>
</html>
