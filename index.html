<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bee Farm 🐝</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#75c957;
    overflow:hidden;
}

.game{
    height:100vh;
    position:relative;
    background:linear-gradient(#7ddcff 0 38%,#75c957 38%);
}

.sun{
    position:absolute;
    right:30px;
    top:25px;
    width:65px;
    height:65px;
    background:#ffd43b;
    border-radius:50%;
}

.cloud{
    position:absolute;
    width:100px;
    height:30px;
    background:white;
    border-radius:30px;
    opacity:.85;
}

.cloud1{left:12%;top:12%}
.cloud2{left:55%;top:20%}

.header{
    position:absolute;
    top:15px;
    left:15px;
    display:flex;
    gap:8px;
    z-index:5;
}

.stat{
    background:white;
    padding:10px 14px;
    border-radius:14px;
    font-weight:bold;
    box-shadow:0 3px 8px #0002;
}

.farm{
    position:absolute;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:850px;
    height:65%;
    background:#69bd4d;
    border:9px solid #805020;
    border-radius:28px;
}

.path{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    height:100%;
    width:100px;
    background:#d5ad70;
}

/* FLOWERS */

.flower{
    position:absolute;
    width:48px;
    height:48px;
    cursor:pointer;
    transition:.2s;
}

.flower:hover{
    transform:scale(1.2);
}

.petal{
    position:absolute;
    width:22px;
    height:22px;
    border-radius:50%;
}

.p1{left:13px;top:0}
.p2{left:0;top:13px}
.p3{right:0;top:13px}
.p4{left:13px;bottom:0}

.center{
    position:absolute;
    left:15px;
    top:15px;
    width:18px;
    height:18px;
    background:#ffd43b;
    border-radius:50%;
    z-index:2;
}

.yellow .petal{background:#ffe066}
.pink .petal{background:#ff7aa2}
.purple .petal{background:#b197fc}

/* HIVE */

.hive{
    position:absolute;
    right:30px;
    top:30px;
    width:105px;
    height:125px;
    background:#f5b642;
    border:6px solid #87571e;
    border-radius:45%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

.hiveText{
    position:absolute;
    top:125px;
    font-size:14px;
    font-weight:bold;
    width:100%;
    text-align:center;
}

/* BEES */

.bee{
    position:absolute;
    font-size:32px;
    animation:fly 3s infinite ease-in-out;
}

.b1{left:22%;top:25%}
.b2{left:62%;top:55%;animation-delay:1s}
.b3{left:37%;top:70%;animation-delay:2s}

@keyframes fly{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(30px,-25px)}
}

/* SHOP */

.shop{
    position:absolute;
    left:25px;
    bottom:25px;
    width:110px;
    height:90px;
    background:#f08c46;
    border:5px solid #7d421d;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
}

.shopText{
    position:absolute;
    bottom:-25px;
    font-size:14px;
    font-weight:bold;
}

/* CONTROL */

.panel{
    position:absolute;
    right:15px;
    bottom:15px;
    width:210px;
    background:white;
    padding:15px;
    border-radius:18px;
    box-shadow:0 5px 15px #0003;
}

button{
    width:100%;
    padding:11px;
    margin-top:8px;
    border:0;
    border-radius:12px;
    background:#ffc928;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ffb703;
}

.message{
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:10px 18px;
    border-radius:20px;
    opacity:0;
    transition:.3s;
    z-index:20;
}

.message.show{
    opacity:1;
}

@media(max-width:600px){
    .panel{
        width:175px;
    }

    .stat{
        font-size:12px;
        padding:8px;
    }
}
</style>
</head>

<body>

<div class="game">

<div class="sun"></div>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div class="header">
    <div class="stat">💰 <span id="coins">100</span></div>
    <div class="stat">🍯 <span id="honey">0</span></div>
    <div class="stat">🐝 <span id="beeCount">2</span></div>
</div>

<div id="message" class="message"></div>

<div class="farm">

<div class="path"></div>

<!-- FLOWERS -->

<div class="flower yellow" style="left:10%;top:15%" onclick="collect(this)">
<div class="petal p1"></div><div class="petal p2"></div>
<div class="petal p3"></div><div class="petal p4"></div>
<div class="center"></div>
</div>

<div class="flower pink" style="left:28%;top:20%" onclick="collect(this)">
<div class="petal p1"></div><div class="petal p2"></div>
<div class="petal p3"></div><div class="petal p4"></div>
<div class="center"></div>
</div>

<div class="flower purple" style="left:12%;top:55%" onclick="collect(this)">
<div class="petal p1"></div><div class="petal p2"></div>
<div class="petal p3"></div><div class="petal p4"></div>
<div class="center"></div>
</div>

<div class="flower yellow" style="left:35%;top:75%" onclick="collect(this)">
<div class="petal p1"></div><div class="petal p2"></div>
<div class="petal p3"></div><div class="petal p4"></div>
<div class="center"></div>
</div>

<div class="flower pink" style="left:68%;top:20%" onclick="collect(this)">
<div class="petal p1"></div><div class="petal p2"></div>
<div class="petal p3"></div><div class="petal p4"></div>
<div class="center"></div>
</div>

<div class="flower purple" style="left:72%;top:70%" onclick="collect(this)">
<div class="petal p1"></div><div class="petal p2"></div>
<div class="petal p3"></div><div class="petal p4"></div>
<div class="center"></div>
</div>

<!-- HIVE -->

<div class="hive">
    🍯
    <div class="hiveText">🐝 My Hive</div>
</div>

<!-- SHOP -->

<div class="shop">
    🏪
    <div class="shopText">Bee Shop</div>
</div>

<!-- BEES -->

<div class="bee b1">🐝</div>
<div class="bee b2">🐝</div>
<div class="bee b3">🐝</div>

</div>

<!-- BUTTONS -->

<div class="panel">

<h2>🐝 Bee Farm</h2>

<p>Flowers se nectar collect karo!</p>

<button onclick="makeHoney()">🍯 Make Honey</button>

<button onclick="buyBee()">🐝 Buy Bee — 75</button>

<button onclick="buyFlower()">🌸 Buy Flower — 50</button>

</div>

</div>

<script>

let coins=100;
let honey=0;
let bees=2;

const coinsUI=document.getElementById("coins");
const honeyUI=document.getElementById("honey");
const beeUI=document.getElementById("beeCount");
const msg=document.getElementById("message");

function update(){

coinsUI.textContent=coins;
honeyUI.textContent=honey;
beeUI.textContent=bees;

}

function show(text){

msg.textContent=text;
msg.classList.add("show");

setTimeout(()=>{
msg.classList.remove("show");
},1500);

}

function collect(flower){

if(flower.dataset.used==="yes"){
show("🌱 Flower is growing...");
return;
}

flower.dataset.used="yes";
flower.style.opacity=".25";

honey+=5*bees;

update();

show("🐝 Nectar collected! +"+(5*bees)+" 🍯");

setTimeout(()=>{

flower.dataset.used="no";
flower.style.opacity="1";

},3000);

}

function makeHoney(){

if(honey<=0){
show("❌ No honey!");
return;
}

let earned=honey*3;

coins+=earned;
honey=0;

update();

show("🍯 Sold! +"+earned+" coins");

}

function buyBee(){

if(coins<75){
show("❌ Need more coins!");
return;
}

coins-=75;
bees++;

let bee=document.createElement("div");

bee.className="bee";
bee.textContent="🐝";

bee.style.left=(20+Math.random()*60)+"%";
bee.style.top=(20+Math.random()*60)+"%";

document.querySelector(".farm").appendChild(bee);

update();

show("🐝 New bee!");

}

function buyFlower(){

if(coins<50){
show("❌ Need more coins!");
return;
}

coins-=50;

let flower=document.createElement("div");

let types=["yellow","pink","purple"];

flower.className="flower "+
types[Math.floor(Math.random()*3)];

flower.style.left=(5+Math.random()*75)+"%";
flower.style.top=(10+Math.random()*75)+"%";

flower.innerHTML=`
<div class="petal p1"></div>
<div class="petal p2"></div>
<div class="petal p3"></div>
<div class="petal p4"></div>
<div class="center"></div>
`;

flower.onclick=function(){
collect(this);
};

document.querySelector(".farm").appendChild(flower);

update();

show("🌸 New flower!");

}

update();

</script>

</body>
</html>
