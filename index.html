<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLICK BATTLE V2</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at 20% 20%,#312e81 0,transparent 35%),
    radial-gradient(circle at 80% 80%,#581c87 0,transparent 35%),
    #070712;
  overflow:hidden;
}

.screen{
  display:none;
  min-height:100vh;
  padding:30px 18px;
  text-align:center;
}

.active{display:block}

.logo{
  font-size:46px;
  font-weight:900;
  margin:25px 0 5px;
  text-shadow:0 0 25px #8b5cf6;
}

.subtitle{
  opacity:.7;
  margin-bottom:30px;
}

.card{
  width:min(460px,100%);
  margin:20px auto;
  padding:25px;
  border:1px solid #ffffff20;
  border-radius:25px;
  background:#ffffff0d;
  backdrop-filter:blur(15px);
  box-shadow:0 20px 60px #0008;
}

button{
  width:100%;
  padding:16px;
  margin:8px 0;
  border:0;
  border-radius:15px;
  font-size:18px;
  font-weight:800;
  color:white;
  cursor:pointer;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  box-shadow:0 8px 25px #4f46e555;
}

button:active{
  transform:scale(.96);
}

.secondary{
  background:#ffffff12;
  box-shadow:none;
}

input{
  width:100%;
  padding:16px;
  margin:8px 0;
  border:1px solid #ffffff25;
  border-radius:15px;
  outline:none;
  background:#09091a;
  color:white;
  font-size:18px;
  text-align:center;
}

.stats{
  display:flex;
  gap:10px;
  margin:15px auto;
  max-width:460px;
}

.stat{
  flex:1;
  padding:14px;
  border-radius:18px;
  background:#ffffff0d;
}

.stat b{
  display:block;
  font-size:25px;
}

.mode{
  display:flex;
  gap:8px;
}

.mode button{
  font-size:14px;
}

#battleTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:700px;
  margin:auto;
}

.bigTime{
  font-size:35px;
  font-weight:900;
}

.combo{
  font-size:25px;
  font-weight:900;
  color:#facc15;
  min-height:35px;
}

.arena{
  position:relative;
  height:55vh;
  max-width:700px;
  margin:10px auto;
  border-radius:25px;
  border:1px solid #ffffff18;
  background:#ffffff08;
  overflow:hidden;
}

#target{
  position:absolute;
  width:105px;
  height:105px;
  border-radius:50%;
  border:5px solid white;
  background:linear-gradient(135deg,#ff2d55,#ff7a18);
  box-shadow:
    0 0 20px #ff2d55,
    0 0 60px #ff2d5588;
  font-size:17px;
  font-weight:900;
  padding:0;
  margin:0;
  transition:left .12s,top .12s,transform .08s;
}

#target:active{
  transform:scale(.82);
}

#effects{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.pop{
  position:absolute;
  font-size:24px;
  font-weight:900;
  animation:pop 700ms forwards;
}

@keyframes pop{
  0%{transform:translateY(0) scale(.7);opacity:1}
  100%{transform:translateY(-70px) scale(1.3);opacity:0}
}

.shake{
  animation:shake .2s;
}

@keyframes shake{
  25%{transform:translateX(-7px)}
  50%{transform:translateX(7px)}
  75%{transform:translateX(-4px)}
}

.resultScore{
  font-size:55px;
  font-weight:900;
}

.rank{
  font-size:28px;
  font-weight:900;
  margin:10px;
}

.small{
  opacity:.65;
}
</style>
</head>

<body>

<!-- HOME -->
<section id="home" class="screen active">

  <div class="logo">⚡ CLICK BATTLE</div>
  <div class="subtitle">ULTIMATE CLICKING ARENA</div>

  <div class="stats">
    <div class="stat">
      🪙
      <b id="coins">0</b>
      Coins
    </div>

    <div class="stat">
      🏆
      <b id="wins">0</b>
      Wins
    </div>

    <div class="stat">
      🔥
      <b id="best">0</b>
      Best
    </div>
  </div>

  <div class="card">

    <h2>🎮 GAME MODE</h2>

    <div class="mode">
      <button onclick="setMode(30)">30 SEC</button>
      <button onclick="setMode(60)">60 SEC</button>
    </div>

    <button onclick="startGame()">⚡ START BATTLE</button>

    <button class="secondary" onclick="showThemes()">
      🎨 THEMES
    </button>

    <button class="secondary" onclick="showProfile()">
      👤 PROFILE
    </button>

  </div>
</section>

<!-- THEMES -->
<section id="themes" class="screen">

  <h1>🎨 THEMES</h1>

  <div class="card">

    <button onclick="theme('neon')">💜 NEON</button>

    <button onclick="theme('fire')">🔥 FIRE</button>

    <button onclick="theme('ice')">❄️ ICE</button>

    <button onclick="theme('space')">🌌 SPACE</button>

    <button class="secondary" onclick="show('home')">
      BACK
    </button>

  </div>
</section>

<!-- PROFILE -->
<section id="profile" class="screen">

  <h1>👤 PROFILE</h1>

  <div class="card">

    <h2>CLICK MASTER</h2>

    <p>🏆 Wins: <b id="profileWins">0</b></p>

    <p>🔥 Best Score: <b id="profileBest">0</b></p>

    <p>🪙 Coins: <b id="profileCoins">0</b></p>

    <div class="rank" id="rank">BRONZE</div>

    <button class="secondary" onclick="show('home')">
      BACK
    </button>

  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">

  <div id="battleTop">

    <div>
      <div class="small">SCORE</div>
      <div class="bigTime" id="score">0</div>
    </div>

    <div>
      <div class="small">TIME</div>
      <div class="bigTime" id="time">30</div>
    </div>

  </div>

  <div class="combo" id="combo"></div>

  <div class="arena" id="arena">

    <button id="target" onclick="hitTarget()">
      CLICK!
    </button>

    <div id="effects"></div>

  </div>

</section>

<!-- RESULT -->
<section id="result" class="screen">

  <div class="logo">🏆</div>

  <div class="card">

    <h1 id="resultTitle">BATTLE COMPLETE</h1>

    <div class="resultScore" id="finalScore">
      0
    </div>

    <p>FINAL SCORE</p>

    <div class="rank" id="finalRank">
      BRONZE
    </div>

    <p>🪙 Coins Earned: <b id="earned">0</b></p>

    <button onclick="startGame()">
      🔄 PLAY AGAIN
    </button>

    <button class="secondary" onclick="show('home')">
      🏠 HOME
    </button>

  </div>

</section>

<script>

let score=0;
let combo=0;
let time=30;
let mode=30;
let timer=null;
let gameRunning=false;

let coins=Number(localStorage.getItem("coins")||0);
let wins=Number(localStorage.getItem("wins")||0);
let best=Number(localStorage.getItem("best")||0);

document.getElementById("coins").innerText=coins;
document.getElementById("wins").innerText=wins;
document.getElementById("best").innerText=best;

function show(id){
  document.querySelectorAll(".screen")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id).classList.add("active");
}

function setMode(seconds){
  mode=seconds;
  alert(seconds+" second mode selected!");
}

function startGame(){

  score=0;
  combo=0;
  time=mode;
  gameRunning=true;

  document.getElementById("score").innerText=0;
  document.getElementById("time").innerText=time;
  document.getElementById("combo").innerText="";

  show("game");

  moveTarget();

  clearInterval(timer);

  timer=setInterval(()=>{

    time--;

    document.getElementById("time").innerText=time;

    if(time<=5 && time>0){
      playSound(300);
    }

    if(time<=0){
      clearInterval(timer);
      finishGame();
    }

  },1000);
}

function hitTarget(){

  if(!gameRunning)return;

  combo++;

  let points=1;
  let message="+1";

  // Critical hit
  if(Math.random()<0.12){

    points=3;
    message="💥 CRITICAL +3";

    playSound(950);

  }else{

    playSound(650);

  }

  // Combo bonus
  if(combo%10===0){

    points+=5;
    message="🔥 "+combo+" COMBO +5";

    playSound(1200);
  }

  score+=points;

  document.getElementById("score").innerText=score;

  document.getElementById("combo").innerText=
    combo>=3 ? "🔥 "+combo+"x COMBO" : "";

  createPop(message);

  moveTarget();

  document.getElementById("arena").classList.remove("shake");

  void document.getElementById("arena").offsetWidth;

  document.getElementById("arena").classList.add("shake");
}

function moveTarget(){

  let arena=document.getElementById("arena");
  let target=document.getElementById("target");

  let maxX=arena.clientWidth-target.offsetWidth;
  let maxY=arena.clientHeight-target.offsetHeight;

  let x=Math.random()*maxX;
  let y=Math.random()*maxY;

  target.style.left=x+"px";
  target.style.top=y+"px";

  // Random size
  let size=75+Math.random()*55;

  target.style.width=size+"px";
  target.style.height=size+"px";
}

function createPop(text){

  let pop=document.createElement("div");

  pop.className="pop";
  pop.innerText=text;

  pop.style.left=(20+Math.random()*60)+"%";
  pop.style.top=(30+Math.random()*40)+"%";

  document.getElementById("effects").appendChild(pop);

  setTimeout(()=>{
    pop.remove();
  },700);
}

function finishGame(){

  gameRunning=false;

  document.getElementById("finalScore").innerText=score;

  let earned=Math.max(5,Math.floor(score/2));

  coins+=earned;

  if(score>best){
    best=score;
  }

  if(score>=50){
    wins++;
  }

  localStorage.setItem("coins",coins);
  localStorage.setItem("wins",wins);
  localStorage.setItem("best",best);

  document.getElementById("earned").innerText=earned;

  let rank=getRank(score);

  document.getElementById("finalRank").innerText=rank;

  if(score>=50){
    document.getElementById("resultTitle").innerText=
      "🔥 VICTORY!";
  }else{
    document.getElementById("resultTitle").innerText=
      "⚡ BATTLE COMPLETE";
  }

  updateUI();

  playSound(1000);

  show("result");
}

function getRank(s){

  if(s>=100)return"💎 MASTER";
  if(s>=75)return"👑 DIAMOND";
  if(s>=50)return"🥇 GOLD";
  if(s>=25)return"🥈 SILVER";

  return"🥉 BRONZE";
}

function updateUI(){

  document.getElementById("coins").innerText=coins;
  document.getElementById("wins").innerText=wins;
  document.getElementById("best").innerText=best;

  document.getElementById("profileCoins").innerText=coins;
  document.getElementById("profileWins").innerText=wins;
  document.getElementById("profileBest").innerText=best;

  document.getElementById("rank").innerText=getRank(best);
}

function showThemes(){
  show("themes");
}

function showProfile(){

  updateUI();

  show("profile");
}

function theme(type){

  if(type==="fire"){
    document.body.style.background=
      "radial-gradient(circle,#7f1d1d,#180707)";
  }

  if(type==="ice"){
    document.body.style.background=
      "radial-gradient(circle,#075985,#020617)";
  }

  if(type==="space"){
    document.body.style.background=
      "radial-gradient(circle,#581c87,#020617)";
  }

  if(type==="neon"){
    document.body.style.background=
      "radial-gradient(circle at 20% 20%,#312e81,transparent 35%),"+
      "radial-gradient(circle at 80% 80%,#581c87,transparent 35%),#070712";
  }

  playSound(800);

  show("home");
}

function playSound(freq){

  try{

    let AudioCtx=
      window.AudioContext||
      window.webkitAudioContext;

    let ctx=new AudioCtx();

    let osc=ctx.createOscillator();
    let gain=ctx.createGain();

    osc.type="sine";
    osc.frequency.value=freq;

    gain.gain.setValueAtTime(.08,ctx.currentTime);

    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime+.15
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();

    osc.stop(ctx.currentTime+.15);

  }catch(e){}
}

updateUI();

</script>

</body>
  </html>
